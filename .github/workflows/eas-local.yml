# Builds on GitHub's runners instead of paid EAS cloud.
# Public repo: standard GitHub-hosted macOS/Linux minutes are free.
#
# Secret: EXPO_TOKEN (https://expo.dev/settings/access-tokens)
# Actions → EAS local build → Run workflow.

name: EAS local build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options:
          - ios
          - android
        default: ios
      profile:
        description: EAS profile
        type: choice
        options:
          - development
          - preview
        default: development

jobs:
  build:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing."
            exit 1
          fi

      - name: Install npm packages
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Confirm Expo login
        run: eas whoami

      - name: Local EAS build
        run: |
          if [ "${{ inputs.platform }}" = "ios" ]; then
            OUT="${{ github.workspace }}/arrangerbox.ipa"
          else
            OUT="${{ github.workspace }}/arrangerbox.apk"
          fi
          eas build --local --non-interactive --wait \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --output "$OUT"
          echo "OUTPUT=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: arrangerbox-${{ inputs.platform }}-${{ inputs.profile }}
          path: |
            arrangerbox.ipa
            arrangerbox.apk
          if-no-files-found: error
          retention-days: 14
