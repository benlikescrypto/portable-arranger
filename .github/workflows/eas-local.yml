# Builds on GitHub's runners instead of paid EAS cloud.
# Public repo: standard GitHub-hosted macOS/Linux minutes are free.
#
# Secret: EXPO_TOKEN (https://expo.dev/settings/access-tokens)
# Actions → EAS local build → Run workflow.
#
# Expo SDK 58 needs Xcode 26.4+. macos-15 ships Xcode 16 and fails in
# ExpoModulesJSI ("Could not resolve package dependencies").

name: EAS local build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options:
          - ios
          - android
        default: ios
      profile:
        description: EAS profile
        type: choice
        options:
          - development
          - preview
        default: development

jobs:
  build:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
      EAS_LOCAL_BUILD_WORKINGDIR: ${{ github.workspace }}/eas-work
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select newest Xcode
        if: inputs.platform == 'ios'
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing."
            exit 1
          fi

      - name: Install npm packages
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Confirm Expo login
        run: eas whoami

      - name: Local EAS build
        run: |
          if [ "${{ inputs.platform }}" = "ios" ]; then
            OUT="${{ github.workspace }}/arrangerbox.ipa"
          else
            OUT="${{ github.workspace }}/arrangerbox.apk"
          fi
          eas build --local --non-interactive --wait \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --output "$OUT"
          echo "OUTPUT=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arrangerbox-${{ inputs.platform }}-${{ inputs.profile }}
          path: |
            arrangerbox.ipa
            arrangerbox.apk
          if-no-files-found: error
          retention-days: 14

      # Free: upload the binary to Expo so the phone gets the Install page.
      # This is not a paid EAS cloud build.
      - name: Upload to Expo
        if: success()
        run: |
          eas upload --platform "${{ inputs.platform }}" \
            --build-path "$OUTPUT" \
            --non-interactive --json > expo-upload.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          url = json.loads(Path("expo-upload.json").read_text())["url"]
          print(url)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a").write(
              "## Install on your phone\n\n"
              "Open this in **Safari** on the iPhone:\n\n"
              f"{url}\n"
          )
          print(f"::notice::Install page {url}")
          PY

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eas-logs-${{ inputs.platform }}-${{ inputs.profile }}
          path: eas-work/logs
          if-no-files-found: warn
          retention-days: 7
