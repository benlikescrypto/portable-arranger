# Builds on GitHub's runners instead of paid EAS cloud.
# Private repo: GitHub Free includes ~$12/month (~2000 Linux minutes, ~190 macOS minutes).
# Public repo: standard GitHub-hosted macOS/Linux minutes are free.
# iOS needs macos-latest. Android can use ubuntu-latest.
#
# One-time: GitHub repo Settings → Secrets → Actions → EXPO_TOKEN
# (create at https://expo.dev/accounts/[account]/settings/access-tokens)
#
# Then: Actions → "EAS local build" → Run workflow.

name: EAS local build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options:
          - ios
          - android
        default: ios
      profile:
        description: EAS profile
        type: choice
        options:
          - development
          - preview
        default: development

jobs:
  build:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install npm packages
        run: npm ci

      - name: Local EAS build
        run: >
          npx eas-cli build --local --non-interactive --wait
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --output ${{ github.workspace }}/arrangerbox-build

      - uses: actions/upload-artifact@v4
        with:
          name: arrangerbox-${{ inputs.platform }}-${{ inputs.profile }}
          path: arrangerbox-build
          if-no-files-found: error
          retention-days: 14
