plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.arrangerboxaudio'
version = '0.1.0'

android {
  namespace "expo.modules.arrangerboxaudio"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17", "-O3", "-ffast-math"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
    ndk {
      abiFilters "arm64-v8a", "x86_64"
    }
  }
  buildFeatures {
    prefab true
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
}

dependencies {
  implementation "com.google.oboe:oboe:1.9.0"
}
